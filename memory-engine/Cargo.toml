[package]
name = "memory-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
candle-core = { version = "0.11", features = ["accelerate"] }
candle-nn = { version = "0.11", features = ["accelerate"] }
candle-transformers = { version = "0.11", features = ["accelerate"] }
chrono = { version = "0.4.45", features = ["serde"] }
hf-hub = "0.4"
rust-stemmers = "1.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokenizers = "0.23.1"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors"] }


[dev-dependencies]
tempfile = "3.27.0"
